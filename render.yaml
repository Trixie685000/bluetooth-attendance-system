services:
  - type: web
    name: bluetooth-attendance
    runtime: node
    plan: free
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: cd server && npm start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        fromDatabase:
          name: bluetooth-attendance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: bluetooth-attendance-db
    plan: free
    databaseName: bluetooth_attendance
    user: bluetooth_attendance
